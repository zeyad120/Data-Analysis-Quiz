<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analysis Quiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="admin.html" class="admin-btn">Admin Panel</a>
    </header>
    
    <main class="container">
        <div class="welcome-section">
            <h1>Welcome to Data Analysis Quiz</h1>
            <p class="click-text">Click on the image to start</p>
            
            <div class="image-container">
                <img src="https://via.placeholder.com/300x200" alt="Data Analysis" id="startQuiz">
            </div>
            
            <div class="name-input">
                <input type="text" id="username" placeholder="Enter your name" required>
                <p class="error-message" id="nameError">Please enter your name</p>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
